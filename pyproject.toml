[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yberu-writer-mcp"
version = "0.1.0"
description = "Revision-guarded MCP control for open LibreOffice Writer documents"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp[cli]==2.3.0"]

[project.optional-dependencies]
test = ["python-xlib>=0.33"]

[project.scripts]
yberu-writer-mcp = "yberu_writer_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
